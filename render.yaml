services:
  - type: web
    name: repovacio-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: repovacio-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      # AUTH_URL no hace falta: el entrypoint la toma de RENDER_EXTERNAL_URL.
      # Definila solo si usas un dominio propio.
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: ADMIN_EMAIL
        value: soyadmin@admin.com
      - key: ADMIN_PASSWORD
        value: "0987654321"
      - key: ADMIN_NAME
        value: Administrador
      - key: APP_NAME
        value: White Label

databases:
  - name: repovacio-db
    plan: free
    databaseName: whitelabel
    user: whitelabel
